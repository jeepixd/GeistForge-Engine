behaviors:
  KillerDrone:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 500000
    threaded: true

env_settings:
  env_path: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  seed: -1

engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 20
  target_frame_rate: -1
  no_graphics: false

# ─── 4-STAGE REWARD-THRESHOLDED GCRL CURRICULUM ───
environment_parameters:

  # ── Goal Distance Minimum ──
  goal_dist_min:
    curriculum:
      - name: Stage1_Warmup
        completion_criteria:
          measure: reward
          behavior: KillerDrone
          min_lesson_length: 200
          threshold: 0.3
          require_reset: true
        value: 2.5
      - name: Stage2_DynamicTracking
        completion_criteria:
          measure: reward
          behavior: KillerDrone
          min_lesson_length: 200
          threshold: 0.5
          require_reset: true
        value: 2.0
      - name: Stage3_DenseClutter
        completion_criteria:
          measure: reward
          behavior: KillerDrone
          min_lesson_length: 200
          threshold: 0.6
          require_reset: true
        value: 2.0
      - name: Stage4_AdversarialCombat
        value: 2.0

  # ── Goal Distance Maximum ──
